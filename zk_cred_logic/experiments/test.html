<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zk-cred state: Browser Experiment Runner</title>
</head>

<body>
    <div id="status">Loading snarkjs...</div>
    <div id="debug"></div>

    <script>
        let snarkjsLib;
        let debugDiv;

        function log(message) {
            console.log(message);
            if (debugDiv) {
                debugDiv.innerHTML += message + '<br>';
            }
        }

        // Load snarkjs using UMD approach
        async function loadSnarkjs() {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = './snarkjs.min.js';
                script.onload = () => {
                    // Wait for the library to be available
                    const checkSnarkjs = () => {
                        if (window.snarkjs && window.snarkjs.groth16) {
                            snarkjsLib = window.snarkjs;
                            log('snarkjs loaded successfully');
                            resolve();
                        } else {
                            // Keep checking every 50ms
                            setTimeout(checkSnarkjs, 50);
                        }
                    };
                    checkSnarkjs();
                };
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }

        // Main initialization
        async function init() {
            try {
                debugDiv = document.getElementById('debug');

                log('Starting snarkjs loading...');
                await loadSnarkjs();

                log('snarkjs loaded, starting experiment...');
                document.getElementById('status').textContent = 'snarkjs loaded successfully! Running tests...';

                // Start the experiment
                startExperiment();

            } catch (error) {
                log('Error during initialization: ' + error.message);
                document.getElementById('status').textContent = 'Failed to load snarkjs: ' + error.message;
            }
        }

        // Start loading when page loads
        window.addEventListener('load', init);
    </script>

    <script>
        async function startExperiment() {
            if (!snarkjsLib || !snarkjsLib.groth16) {
                log('snarkjs not properly loaded');
                return;
            }

            log('Starting experiment...');

            // URL params: k, N (runs), mode=success|failure
            const params = new URLSearchParams(window.location.search);
            const k = parseInt(params.get('k') || '5');
            const N = parseInt(params.get('N') || params.get('runs') || '100');
            const mode = (params.get('mode') || 'success').toLowerCase();

            document.getElementById('status').textContent = `Loading inputs and running ${N} ${mode} tests for k=${k}...`;

            try {
                // Load the pre-generated inputs
                const inputFile = `k${k}/inputs_k${k}_N${N}_${mode}.json`;
                log(`Loading inputs from ${inputFile}...`);

                const inputs = await (await fetch(inputFile)).json();
                log(`Loaded ${inputs.length} pre-generated inputs`);

                // Load verification key
                const vKey = await (await fetch('verification_key.json')).json();
                log('Verification key loaded');

                output = `proveTimeMs,verifyTimeMs\n`;

                // Run the tests
                for (let i = 0; i < Math.min(N, inputs.length); i++) {
                    log(`Running test ${i + 1}/${Math.min(N, inputs.length)}...`);

                    const input_obj = inputs[i];

                    const startProve = performance.now();
                    let proof, publicSignals, proveError = null;
                    try {
                        ({ proof, publicSignals } = await snarkjsLib.groth16.fullProve(input_obj, 'state_js/state.wasm', 'state_0001.zkey'));
                    } catch (e) {
                        proveError = e?.message || String(e);
                    }
                    const endProve = performance.now();
                    const proveTimeMs = endProve - startProve;

                    let verifyTimeMs = null, res = null, verifyError = null;
                    if (!proveError) {
                        const startVerify = performance.now();
                        try {
                            res = await snarkjsLib.groth16.verify(vKey, publicSignals, proof);
                        } catch (e) {
                            verifyError = e?.message || String(e);
                        }
                        const endVerify = performance.now();
                        verifyTimeMs = endVerify - startVerify;
                    }

                    log(`Run ${i}: Prove ${proveTimeMs.toFixed(2)}ms${proveError ? ", Error: " + proveError : ""}, Verify ${verifyTimeMs !== null ? verifyTimeMs.toFixed(2) : "-"}ms, Result: ${res}`);
                    output += `${proveTimeMs.toFixed(2)},${verifyTimeMs.toFixed(2)}\n`;
                }

                document.getElementById('status').textContent = `Done! Check console and debug output for ${Math.min(N, inputs.length)} run results.`;
                log('Experiment completed successfully!');

                const outputFile = `k${k}/out.csv`;
                await fetch(outputFile, {
                    method: 'POST',
                    body: output,
                });

            } catch (error) {
                log('Error during experiment: ' + error.message);
                document.getElementById('status').textContent = 'Experiment failed: ' + error.message;

                if (error.message.includes('Failed to fetch')) {
                    log('Make sure to run the Node.js script first to generate inputs:');
                    log('node generate_inputs.js <k> <N> <mode>');
                    log('Example: node generate_inputs.js 5 100 success');
                }
            }
        }
    </script>

</body>

</html>
